buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://maven.minecraftforge.net' }
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-20211118.174922-42' }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.0.32-legacy189.10'
group = 'dev.mineagent.runtime'
archivesBaseName = 'DivZero-forge-1.8.9'
jar {
    manifest { attributes 'FMLCorePlugin': 'dev.mineagent.runtime.legacy189.coremod.LegacyCore', 'FMLCorePluginContainsFMLMod': 'true' }
    from('../../LICENSE') { into 'META-INF/divzero/licenses' }
    from('../../NOTICE') { into 'META-INF/divzero/licenses' }
    def notices = file('../../docs/THIRD_PARTY_NOTICES.md')
    if (!notices.isFile()) notices = file('../../docs/public/THIRD_PARTY_NOTICES.md')
    from(notices) { into 'META-INF/divzero/licenses' }
}
sourceCompatibility = targetCompatibility = '1.8'
repositories {
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net' }
}
minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    mappings = 'stable_20'
    runDir = 'run'
    makeObfSourceJar = false
}
// Both sides use the same Java 8 protocol source; no modern core class enters FML's scanner.
sourceSets.main.java.srcDir '../bridge/src/main/java'
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
task stageLegacyService {
    def output = file("$buildDir/generated/legacy-service/META-INF/divzero")
    if (project.hasProperty('serviceJar')) inputs.file file(project.property('serviceJar'))
    outputs.dir output
    doLast {
        if (project.hasProperty('serviceJar')) {
            def service = file(project.property('serviceJar'))
            if (!service.isFile()) throw new GradleException('LEGACY_SERVICE_ARTIFACT_MISSING')
            output.mkdirs()
            copy { from service; into output; rename { 'service.jar' } }
            new File(output, 'service.sha256').text = java.security.MessageDigest.getInstance('SHA-256').digest(service.bytes).encodeHex().toString() + '\n'
        }
    }
}
sourceSets.main.resources.srcDir "$buildDir/generated/legacy-service"
processResources.dependsOn stageLegacyService
processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) { include 'mcmod.info'; expand version: project.version }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
    from('../../core/src/main/resources/dev/mineagent/runtime/policy/pretrained.json') { into 'dev/mineagent/runtime/policy' }
}
// ForgeGradle's legacy repository URLs must use the live HTTPS repository.
allprojects {
    repositories.all { repository ->
        if (repository instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
            def url = repository.url.toString()
            if (url.contains('files.minecraftforge.net/maven')) repository.url = uri('https://maven.minecraftforge.net')
            if (url.startsWith('http://')) repository.url = uri(url.replaceFirst('http://', 'https://'))
        }
    }
}
