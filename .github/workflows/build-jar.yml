name: Build JAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Build and test an artifact without publishing a Release'
        required: false
        type: boolean
        default: false
      include_media_tools:
        description: 'Include pinned Windows yt-dlp/FFmpeg binaries (larger download)'
        required: false
        type: boolean
        default: false

# Build code with read-only permissions; only the guarded publish job can write Releases.
permissions:
  contents: read

concurrency:
  group: jar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 25 / NeoForge JAR
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
      variant: ${{ steps.package.outputs.variant }}
      mod-version: ${{ steps.version.outputs.mod-version }}
    env:
      CI: 'true'
      BUILD_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.include_media_tools && 'with-media' || 'standard' }}

    steps:
      - name: Check out public source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate wrapper and set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5 (peeled commit)
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          dependency-graph: disabled

      - name: Test release packaging and version guards
        run: ./scripts/test-ci-release.ps1

      - name: Resolve a unique source-based Mod version
        id: version
        run: |
          $version = & ./scripts/get-build-version.ps1 -Commit '${{ github.sha }}'
          "DIVZERO_BUILD_VERSION=$version" >> $env:GITHUB_ENV
          "mod-version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "MOD_VERSION=$version"

      - name: Prepare optional pinned media tools
        if: github.event_name == 'workflow_dispatch' && inputs.include_media_tools
        run: ./scripts/prepare-media-tools.ps1

      - name: Test conversation streaming, scrolling and thinking history
        run: node --test client/src/test/webui/conversation-cache.test.mjs client/src/test/webui/conversation-scroll.test.mjs client/src/test/webui/conversation-thinking.test.mjs

      - name: Compile production JAR and run included tests
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/ci-logs -Force | Out-Null
          & ./gradlew.bat -I scripts/release-build.init.gradle "-Pmod_version=$env:DIVZERO_BUILD_VERSION" :neoforge:jar :neoforge:verifyProductionUiParser :neoforge:test :api:test :core:test :worker:test :client:test --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object -FilePath build/ci-logs/gradle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage and verify runtime JARs and internal audit files
        id: package
        run: ./scripts/package-ci-artifact.ps1 -Variant $env:BUILD_VARIANT

      - name: Verify pinned MCEF alternatives and the runtime-only publish list
        run: |
          ./scripts/stage-offline-mcef.ps1
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_COMMIT_LOOKUP_FAILED' }
          ./scripts/publish-ci-release.ps1 -Commit $commit -Variant $env:BUILD_VARIANT -AssetDirectory build/ci-artifacts -DryRun

      - name: Transfer verified files to the release job
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: build/ci-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload diagnostics if the build failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-logs/*.log
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish installable JAR assets only
    needs: build
    if: github.repository == 'gaoshanliuni/divzero' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.build_only))
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out trusted main workflow scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Download this build's verified files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: build/release-assets
      - name: Publish immutable version tag and runtime assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_VARIANT: ${{ needs.build.outputs.variant }}
          DIVZERO_BUILD_VERSION: ${{ needs.build.outputs.mod-version }}
        run: ./scripts/publish-ci-release.ps1 -Commit $env:SOURCE_COMMIT -Variant $env:BUILD_VARIANT
