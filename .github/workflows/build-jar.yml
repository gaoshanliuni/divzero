name: Build JAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_media_tools:
        description: 'Include pinned Windows yt-dlp/FFmpeg binaries (larger download)'
        required: false
        type: boolean
        default: false

# Public-source build only: no repository writes, releases, model keys or private sync.
permissions:
  contents: read

concurrency:
  group: jar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 25 / NeoForge JAR
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      BUILD_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.include_media_tools && 'with-media' || 'standard' }}

    steps:
      - name: Check out public source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate wrapper and set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5 (peeled commit)
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          dependency-graph: disabled

      - name: Prepare optional pinned media tools
        if: github.event_name == 'workflow_dispatch' && inputs.include_media_tools
        run: ./scripts/prepare-media-tools.ps1

      - name: Compile production JAR and run included tests
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/ci-logs -Force | Out-Null
          & ./gradlew.bat :neoforge:jar :neoforge:verifyProductionUiParser :core:test :worker:test :client:test --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object -FilePath build/ci-logs/gradle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package verified JAR and checksum
        id: package
        run: ./scripts/package-ci-artifact.ps1 -Variant $env:BUILD_VARIANT

      - name: Upload installable JAR
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: divzero-${{ env.BUILD_VARIANT }}-${{ steps.package.outputs.short-sha }}
          path: build/ci-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Add download link to run summary
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "## DivZero JAR" >> $env:GITHUB_STEP_SUMMARY
          "[Download JAR + SHA256SUMS + build information]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Variant: $env:BUILD_VARIANT. This is a CI build, not a formal Release or full in-game acceptance." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload diagnostics if the build failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-logs/*.log
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 7
