name: Focused production and dialogue checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile current migration source
        run: |
          New-Item -ItemType Directory -Force build/development-logs | Out-Null
          & ./gradlew.bat -PpythonRuntime=none :neoforge:compileJava --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/compile.log
          exit $LASTEXITCODE
      - name: Verify production, disclosure and dialogue contracts
        run: |
          & ./gradlew.bat -PpythonRuntime=none :core:test --tests '*BuildingDesignTest' --tests '*ConstructionLedgerTest' --tests '*ProcessingSpecTest' --tests '*TaskReferenceContextTest' --tests '*CapabilitySessionTest' --tests '*ConversationStoreTest' --tests '*CooperationPlanTest' --tests '*CooperationRetentionTest' --tests '*CraftingInventoryProofTest' --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/production-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./gradlew.bat -PpythonRuntime=none :worker:test --tests '*RealProviderSmokeAuditTest' --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/provider-audit-tests.log
          exit $LASTEXITCODE
      - name: Package isolated test candidate after selected contracts pass
        run: |
          & ./gradlew.bat -PpythonRuntime=none :neoforge:jar --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/candidate-jar.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-candidate-${{ github.run_id }}
          path: build/editions/none/neoforge/libs/*.jar
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-compile-${{ github.run_id }}
          path: build/development-logs/*
          retention-days: 7
