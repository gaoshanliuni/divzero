name: Development compile (no project content digests)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile active source without running incomplete migrations
        run: |
          New-Item -ItemType Directory -Force build/development-logs | Out-Null
          & ./gradlew.bat -PpythonRuntime=none :neoforge:compileJava --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/compile.log
          exit $LASTEXITCODE
      - name: Verify resource parsing, immutable IDs and semantic scope contracts
        run: |
          & ./gradlew.bat -PpythonRuntime=none :core:test --tests '*NativeCompilationIdentityTest' --tests '*NewWorldIdentityTest' --tests '*PlayerPreferenceIdentityTest' --tests '*PersistentAgentServiceTest' --tests '*CodeSourceVersionTest' --tests '*SourceSetPublicationTest' --tests '*ScriptDependencySourcesTest' --tests '*ContentAddressedStoreTest' --tests '*ObservationTokensTest' --tests '*ContainerTransactionTest' --tests '*LegacyNamespaceIdsTest' --tests '*SemanticMemoryIndexTest' --tests '*DialogueMemoryStoreTest' --tests '*PackageSignature*Test' --tests '*GatherSkillContractTest' --tests '*CooperationPlanTest' --tests '*AssignedTaskIdsTest' --tests '*AssignedOperationIdsTest' --tests '*ContentPackageServiceTest' --tests '*LegacyContentPackageMigratorTest' --tests '*ConstructionLedgerTest' --tests '*NativeUiEventStoreTest' --tests '*ConversationSummaryStoreTest' --tests '*ConversationStoreTest' --tests '*PythonPathsTest' --tests '*AgentPersonaServiceTest' --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/core-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./gradlew.bat -PpythonRuntime=none :scripting:test --tests '*CodeDraftVersionMigrationTest' --tests '*CodeDraftServiceTest' --tests '*StudioCoderDependencyJournalTest' --tests '*ManagedScriptDependencyTest' --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/source-lifecycle-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./gradlew.bat -PpythonRuntime=none :worker:test --tests '*JavaSourceCompilerTest' --tests '*StudioCoderDependencyPromptTest' --tests '*ResourceParserTest' --tests '*ExecutionProgressTest' --tests '*BundledMediaToolsTest' --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/resource-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./gradlew.bat -PpythonRuntime=none :client:test --tests '*ServerTrustStoreTest' --tests '*UiStateStoreTest' --tests '*TrustedClientPackageStoreTest' --tests '*BlockTextureStoreTest' --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/client-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./gradlew.bat -PpythonRuntime=none :neoforge:test --tests '*BuildingUiDocumentsTest' --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/building-documents-tests.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-compile-${{ github.run_id }}
          path: build/development-logs/*
          retention-days: 7
