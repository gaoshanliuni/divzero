name: BOOT native compilation install and restart checks
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile current migration source
        run: |
          New-Item -ItemType Directory -Force build/development-logs | Out-Null
          & ./gradlew.bat -PpythonRuntime=none :neoforge:compileJava --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/compile.log
          exit $LASTEXITCODE
      - name: Verify scoped permissions, geometry and script exit/deadline contracts
        run: |
          & ./gradlew.bat -PpythonRuntime=none :core:test --tests '*PermissionServiceTest' --tests '*ConstructionLedgerTest' --tests '*WorldGeometryTest' --tests '*RuntimeInstanceCacheTest' --tests '*FairTickBudgetTest' --tests '*GeometrySpoolTest' --tests '*SurfacePathfinderTest' --tests '*CapabilitySessionTest' --tests '*RuntimeMeshTest' --tests '*RuntimeMaterialsTest' --tests '*RuntimeItemBindingTest' --tests '*NativeEntityDefinitionTest' --tests '*CreatureDefinitionTest' --tests '*BootArtifactIdentityTest' --tests '*BootActivationStepTest' --tests '*JavaMaintenanceTest' --tests '*InteractionRuleSpecTest' --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/production-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./gradlew.bat -PpythonRuntime=none :agent:test --tests '*ChunkTicketLedgerTest' --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/ticket-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./gradlew.bat -PpythonRuntime=none :scripting:test --tests '*ScriptPreflightTest' --tests '*ManagedScriptRuntimeTest' --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/provider-audit-tests.log
          exit $LASTEXITCODE
      - name: Package isolated test candidate after selected contracts pass
        run: |
          & ./gradlew.bat -PpythonRuntime=none :neoforge:jar --no-daemon --no-configuration-cache --max-workers=1 --console=plain 2>&1 | Tee-Object build/development-logs/candidate-jar.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-candidate-${{ github.run_id }}
          path: build/editions/none/neoforge/libs/*.jar
          retention-days: 7
      - name: Actual Worker build install and next-JVM Loader proof
        run: |
          $candidate = (Get-ChildItem build/editions/none/neoforge/libs/*.jar | Select-Object -First 1).FullName
          & ./.github/scripts/boot-automatic.ps1 -Candidate $candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-native-${{ github.run_id }}
          path: |
            build/native-boot-ci/*.json
            build/native-boot-ci/*.log
            build/native-boot-ci/server/boot-automatic-ci/*
            build/native-boot-ci/server/logs/latest.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-compile-${{ github.run_id }}
          path: build/development-logs/*
          retention-days: 7
