pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mineagent-runtime'

include 'api'
include 'core'
include 'agent'
include 'scripting'
include 'client'
include 'integrations:ysm'
include 'worker'
include 'neoforge'
