plugins {
    id 'base'
}

ext.pythonRuntime = providers.gradleProperty('pythonRuntime').getOrElse('none')
if (!(pythonRuntime in ['none', 'bundled'])) throw new GradleException('PYTHON_EDITION_INVALID')

allprojects {
    group = mod_group_id
    version = mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.saps.dev/releases' }
    }
}

subprojects {
    // Different source sets must never share incremental class/resource outputs.
    layout.buildDirectory = rootProject.layout.projectDirectory.dir("build/editions/${rootProject.pythonRuntime}/${project.path.substring(1).replace(':', '/')}")
    plugins.withType(JavaPlugin).configureEach {
        if (project.name == 'core') {
            sourceSets.main.java.srcDir "src/main/variants/${rootProject.pythonRuntime}/java"
            def editionMetadata = tasks.register('generateEditionMetadata') {
                inputs.property('python', rootProject.pythonRuntime)
                def out = layout.buildDirectory.dir('generated/edition')
                outputs.dir(out)
                doLast {
                    def file = out.get().file('META-INF/divzero/edition.properties').asFile
                    file.parentFile.mkdirs()
                    file.setText("python=${rootProject.pythonRuntime}\n", 'UTF-8')
                }
            }
            sourceSets.main.resources.srcDir(editionMetadata)
        }
        if (rootProject.pythonRuntime == 'none') {
            if (project.name in ['core', 'client']) {
                sourceSets.main.java.exclude '**/host/**'
                sourceSets.test.java.exclude '**/host/**'
            }
            if (project.name == 'client') sourceSets.main.resources.exclude 'META-INF/divzero/python/**'
            if (project.name == 'neoforge') {
                sourceSets.main.java.exclude '**/client/host/**', '**/host/LocalHostCommands.java', '**/PythonHostSmokeClient.java', '**/PythonHostSmokeServer.java'
            }
        }
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(25)
            withSourcesJar()
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 25
            options.compilerArgs.addAll '-Xlint:deprecation', '-Xlint:unchecked'
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            systemProperty 'divzero.pythonRuntimeRoot', rootProject.file('build/python-runtime-tests').absolutePath
            jvmArgs '--enable-native-access=ALL-UNNAMED'
            testLogging {
                events 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }

        dependencies {
            testImplementation platform("org.junit:junit-bom:${junit_version}")
            testImplementation 'org.junit.jupiter:junit-jupiter'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
    }
}

tasks.register('ci') {
    group = 'verification'
    description = 'Builds the source snapshot and runs its included offline tests; not a V1 acceptance gate.'
    dependsOn subprojects.collect { it.tasks.matching { task -> task.name == 'build' } }
}
