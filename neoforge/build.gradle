plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'idea'
}

// Immutable native UI release IDs.
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}


configurations { nativeUiLocked }
def nativeUiHashes = [
    'B1CBVXHX-15aCZh6V.jar': '613f7e5d890c3c6c89f62e52a6336e775d83766c39cd52d5e1822e45c3520826',
    'umyGl7zF-FzLyIIBB.jar': '36df262649e53c4b8256193198e7f5d225a6fec05f4b1e74e55c271e657ea5f0'
]
tasks.register('verifyNativeUiDependencies') {
    group = 'verification'
    inputs.files(configurations.nativeUiLocked)
    inputs.property('hashes', nativeUiHashes)
    doLast {
        def hashes = inputs.properties['hashes']
        if (inputs.files.files.size() != hashes.size()) throw new GradleException('Unexpected native UI dependency set')
        inputs.files.files.each { jar ->
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
            if (hashes[jar.name] != actual) throw new GradleException("Native UI integrity mismatch: ${jar.name}")
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyNativeUiDependencies' }

tasks.register('verifyProductionUiParser') {
    group = 'verification'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    doLast {
        new java.util.zip.ZipFile(inputs.files.singleFile).withCloseable { zip ->
            def entry = zip.getEntry('META-INF/jarjar/jsoup-1.18.3.jar')
            if (entry == null) throw new GradleException('MISSING_PRODUCTION_UI_PARSER: Jsoup must be visible to the game/server classloader, not only the child Worker')
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(zip.getInputStream(entry).bytes).encodeHex().toString()
            if (hash != '5be1ccd3228ae5fd6eed1bd6d827bac2bc65b91c20e9957d16ea65f739f15302') throw new GradleException('PRODUCTION_UI_PARSER_HASH_MISMATCH')
            logger.lifecycle("PRODUCTION_UI_PARSER_VERIFIED=${hash}")
        }
    }
}
tasks.named('check') { dependsOn 'verifyProductionUiParser' }

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        nativeUiClient { client(); systemProperty 'mineagent.nativeUiSmoke','true' }
        nativePackageClient { client(); systemProperty 'mineagent.nativePackageSmoke','true' }
        nativeStudioClient { client(); systemProperty 'mineagent.nativeStudioSmoke','true' }
        componentBuildingClient { client(); systemProperty 'mineagent.componentBuildingSmoke','true' }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        data { clientData(); programArguments.addAll '--mod',project.mod_id,'--all','--output',file('src/generated/resources').absolutePath,'--existing',file('src/main/resources').absolutePath }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Keep JUnit on the ordinary test runner while exposing the same mapped game API used by main.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Locked upstream native UI APIs. F2 uses LDLib2 directly; AI-authored trees additionally use KubeJS.
    implementation('maven.modrinth:B1CBVXHX:15aCZh6V') { transitive = false }
    implementation('maven.modrinth:umyGl7zF:FzLyIIBB') { transitive = false }
    nativeUiLocked('maven.modrinth:B1CBVXHX:15aCZh6V') { transitive = false }
    nativeUiLocked('maven.modrinth:umyGl7zF:FzLyIIBB') { transitive = false }
    // Both are already supplied at runtime (Rhino below; Taffy inside LDLib2).
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    compileOnly 'dev.vfyjxf:taffy:1.1.4'
    implementation project(':api')
    implementation project(':core')
    implementation project(':agent')
    implementation project(':scripting')
    implementation project(':client')
    implementation project(':integrations:ysm')
    implementation project(':worker')
    implementation 'javazoom:jlayer:1.0.1'
    implementation "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"

    jarJar "dev.latvian.mods:rhino:${rhino_version}"
    jarJar "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"
    jarJar "com.fasterxml.jackson.core:jackson-annotations:${jackson_version.substring(0, jackson_version.lastIndexOf('.'))}"
    jarJar "com.fasterxml.jackson.core:jackson-core:${jackson_version}"
    jarJar "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
    jarJar "com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:${jackson_version}"
    jarJar 'javazoom:jlayer:[1.0.1]'
    jarJar 'org.jsoup:jsoup:[1.18.3]'

    if (project.hasProperty('ysmJar')) {
        localRuntime files(project.property('ysmJar'))
    }
}

def embeddedProjects = [
        project(':api'), project(':core'), project(':agent'), project(':scripting'),
        project(':client'), project(':integrations:ysm'), project(':worker')
]

tasks.named('jar', Jar).configure {
    dependsOn embeddedProjects.collect { it.tasks.named('classes') }
    from embeddedProjects.findAll { it != project(':worker') }.collect { it.sourceSets.main.output }
    from(project(':worker').sourceSets.main.output) {
        // The managed Worker JAR owns these large resources. Do not duplicate them in the outer Mod JAR.
        exclude 'META-INF/mineagent/tools/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replacements = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources').configure {
    from('src/main/resources/assets/mineagent_runtime/icon.png') { rename { 'logo.png' } }
    dependsOn project(':worker').tasks.named('fatJar')
    // FML's dev Mod module cannot see sibling project resources through Class.getResource.
    // Copy the same authored client resources that the release JAR embeds, not a test-only replacement.
    from(project(':client').layout.projectDirectory.dir('src/main/resources'))
    from(project(':worker').tasks.named('fatJar')) {
        into 'META-INF/mineagent/worker'
        rename { 'mineagent-worker.jar' }
    }
}

tasks.register('verifyModBranding') {
    group = 'verification'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    doLast {
        new java.util.zip.ZipFile(inputs.files.singleFile).withCloseable { zip ->
            def metadata = zip.getEntry('META-INF/neoforge.mods.toml')
            if (metadata == null) throw new GradleException('MOD_METADATA_MISSING')
            def toml = zip.getInputStream(metadata).getText('UTF-8')
            if (!toml.contains('logoFile="logo.png"') || !toml.contains('authors="gaoshanliuni"') || !toml.contains('displayURL="https://github.com/gaoshanliuni/divzero"')) throw new GradleException('MOD_BRANDING_METADATA_INVALID')
            def original = zip.getEntry('assets/mineagent_runtime/icon.png'), rootLogo = zip.getEntry('logo.png')
            if (original == null || rootLogo == null) throw new GradleException('MOD_ICON_NOT_PACKAGED')
            byte[] source = zip.getInputStream(original).bytes, root = zip.getInputStream(rootLogo).bytes
            if (!java.util.Arrays.equals(source, root)) throw new GradleException('MOD_ICON_BYTES_DIFFER')
            def image = javax.imageio.ImageIO.read(new java.io.ByteArrayInputStream(root))
            if (image == null || image.width != 1024 || image.height != 1024) throw new GradleException('MOD_ICON_INVALID_PNG')
            logger.lifecycle('MOD_BRANDING_VERIFIED: logo.png + namespaced icon, 1024x1024')
        }
    }
}
tasks.named('jar') { finalizedBy 'verifyModBranding' }
tasks.named('check') { dependsOn 'verifyModBranding' }

// Historical unfinished browser acceptance sources are preserved untouched, outside the shipped runtime.
sourceSets.main.java.exclude '**/PackageAssetSmokeClient.java', '**/PackageAssetSmokeServer.java'
