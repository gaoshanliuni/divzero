plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'idea'
}

// Immutable upstream release IDs (the old mcef-keksuccino slug now returns 404).
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

configurations { webguiLocked }

def webguiArtifacts = [
        'tDw1xQja-SVU4eUap.jar': 'fd7feec4c60b74c9c6fc0d831fa0599267a2204353b9958e36649351a90dd7b0',
        'bQhBuv7x-h38n5aI0.jar': '7043d21c4deaf4149401aa4d1761b73ca63386874c0c5ce1fa80d6ae601e65d0'
]
tasks.register('verifyWebGuiDependencies') {
    group = 'verification'
    inputs.files(configurations.webguiLocked)
    inputs.property('hashes', webguiArtifacts)
    doLast {
        def hashes = inputs.properties['hashes']
        def jars = inputs.files.files
        if (jars.size() != hashes.size()) throw new GradleException('Unexpected WebGUI dependency set')
        jars.each { jar ->
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
            if (hashes[jar.name] != actual) throw new GradleException("WebGUI integrity mismatch: ${jar.name}")
            logger.lifecycle("WebGUI dependency verified: ${jar.name} ${actual}")
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyWebGuiDependencies' }
tasks.register('verifyProductionUiParser') {
    group = 'verification'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    doLast {
        new java.util.zip.ZipFile(inputs.files.singleFile).withCloseable { zip ->
            def entry = zip.getEntry('META-INF/jarjar/jsoup-1.18.3.jar')
            if (entry == null) throw new GradleException('MISSING_PRODUCTION_UI_PARSER: Jsoup must be visible to the game/server classloader, not only the child Worker')
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(zip.getInputStream(entry).bytes).encodeHex().toString()
            if (hash != '5be1ccd3228ae5fd6eed1bd6d827bac2bc65b91c20e9957d16ea65f739f15302') throw new GradleException('PRODUCTION_UI_PARSER_HASH_MISMATCH')
            logger.lifecycle("PRODUCTION_UI_PARSER_VERIFIED=${hash}")
        }
    }
}
tasks.named('check') { dependsOn 'verifyProductionUiParser' }

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

