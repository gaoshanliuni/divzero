tasks.register('runProductionYsmSmoke', JavaExec) {
    group = 'verification'
    description = 'Builds the Mod and runs the pinned YSM in a real FancyModLoader CLIENT in PROD.'
    dependsOn tasks.named('jar'), project(':worker').tasks.named('classes')
    classpath = project(':worker').sourceSets.main.runtimeClasspath
    mainClass = 'dev.mineagent.runtime.worker.smoke.ProductionYsmSmokeLauncher'
    doFirst {
        if (!productionYsmJar.isPresent()) {
            throw new GradleException('Pass the pinned YSM path with -PysmJar=<path>')
        }
        if (!productionJavaHome.isPresent() || productionJavaHome.get().isBlank()) {
            throw new GradleException('JAVA_HOME must point to the locked Java 25 runtime')
        }
        setArgs([
                productionMinecraftRoot.absolutePath,
                productionVersionDir.absolutePath,
                productionYsmGameDir.absolutePath,
                productionModJar.get().asFile.absolutePath,
                new File(productionYsmJar.get()).absolutePath,
                productionJavaHome.get(),
                productionSmokeWorld.absolutePath
        ])
    }
}

