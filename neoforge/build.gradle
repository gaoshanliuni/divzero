['A', 'B'].each { suffix ->
    def optionsFile = layout.projectDirectory.file("run-smoke-multiplayer-client-${suffix.toLowerCase()}/options.txt")
    tasks.named("runSmokeMultiplayerClient${suffix}").configure {
        doFirst {
            def options = optionsFile.asFile
            options.parentFile.mkdirs()
