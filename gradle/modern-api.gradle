// Reviewed source translations for the 26.2+ native API. Original 26.1.2 sources are never rewritten.
// Algorithm and feature code stays shared. Structural render/mixin changes use explicit target adapters.
def translate = { String line ->
    // NeoForge 26.2 EntityInteract handles both plain and position-specific interactions.
    // The existing general handler contains the same authorization and callback behavior.
    if (line.contains('@SubscribeEvent') && line.contains('PlayerInteractEvent.EntityInteractSpecific')) return ' // Position-specific interaction is covered by the unified EntityInteract handler above.'
    def colors = ['WHITE':'white','ORANGE':'orange','MAGENTA':'magenta','LIGHT_BLUE':'lightBlue','YELLOW':'yellow','LIME':'lime','PINK':'pink','GRAY':'gray','LIGHT_GRAY':'lightGray','CYAN':'cyan','PURPLE':'purple','BLUE':'blue','BROWN':'brown','GREEN':'green','RED':'red','BLACK':'black']
    def groups = ['WOOL':'WOOL','TERRACOTTA':'DYED_TERRACOTTA','CARPET':'CARPET','STAINED_GLASS':'STAINED_GLASS','STAINED_GLASS_PANE':'STAINED_GLASS_PANE','SHULKER_BOX':'DYED_SHULKER_BOX','GLAZED_TERRACOTTA':'GLAZED_TERRACOTTA','CONCRETE':'CONCRETE','CONCRETE_POWDER':'CONCRETE_POWDER','CANDLE':'DYED_CANDLE','CANDLE_CAKE':'DYED_CANDLE_CAKE','BED':'BED','BANNER':'BANNER','WALL_BANNER':'WALL_BANNER','DYE':'DYE','HARNESS':'HARNESS','BUNDLE':'DYED_BUNDLE']
    line = line.replaceAll(/\b(Blocks|Items)\.([A-Z_]+)\b/) { all, registry, name ->
        def color = colors.keySet().sort { -it.length() }.find { name.startsWith(it + '_') }
        def group = color == null ? null : groups[name.substring(color.length()+1)]
        group == null ? all : "${registry}.${group}.${colors[color]}()"
    }
    line = line.replaceAll(/(?<![\w.])(?:net\.minecraft\.world\.entity\.)?EntityType\.([A-Z_]+)\b/) { all, name ->
        name in ['CODEC','STREAM_CODEC'] ? all : "net.minecraft.world.entity.EntityTypes.${name}"
    }
    line = line.replaceAll(/(?<![\w.])(?:net\.minecraft\.world\.level\.block\.entity\.)?BlockEntityType\.([A-Z_]+)\b/) { all, name ->
        name in ['CODEC','STREAM_CODEC'] ? all : "net.minecraft.world.level.block.entity.BlockEntityTypes.${name}"
    }
    def receiver = /(?:net\.minecraft\.client\.)?Minecraft\.getInstance\(\)|mc\(\)|mc|minecraft|this\.minecraft|client/
    line = line.replaceAll("(?<![\\w.])(${receiver})\\.screen\\b") { all, value -> "${value}.gui.screen()" }
    line = line.replaceAll("(?<![\\w.])(${receiver})\\.setScreen\\(") { all, value -> "${value}.gui.setScreen(" }
    line = line.replaceAll("(?<![\\w.])(${receiver})\\.getOverlay\\(\\)") { all, value -> "${value}.gui.overlay()" }
    line = line.replaceAll("(?<![\\w.])(${receiver})\\.getMainRenderTarget\\(\\)") { all, value -> "${value}.gameRenderer.mainRenderTarget()" }
    line = line.replace('.gameRenderer.getMainCamera()', '.gameRenderer.mainCamera()')
    line = line.replaceAll(/\.gui\.(getChat|getGuiTicks|setOverlayMessage|getTabList|getBossOverlay)\(/) { all, method -> ".gui.hud.${method}(" }
    line = line.replaceAll("(?<![\\w.])(${receiver})\\.options\\.hideGui\\s*=\\s*([^;]+);") { all, value, hide -> "dev.mineagent.runtime.neoforge.client.nativeui.NativeTargetApi.hideHud(${value},${hide});" }
    line = line.replaceAll("(?<![\\w.])(${receiver})\\.options\\.hideGui\\b") { all, value -> "${value}.gui.hud.isHidden()" }
    line = line.replace('.levelRenderer.needsUpdate()', '.levelRenderer.sectionOcclusionGraph().invalidate()')
    line = line.replace('target.getColorTexture(),0,target.getDepthTexture(),1.0', 'target.getColorTexture(),new org.joml.Vector4f(),target.getDepthTexture(),1.0')
    line = line.replace('team.getColor().getName()', 'team.getColor().map(net.minecraft.world.scores.TeamColor::getSerializedName).orElse("reset")')
    line = line.replace('chest.getCenter()', 'net.minecraft.world.phys.Vec3.atCenterOf(chest)')
    line = line.replace('Blocks.COPPER_BLOCK)', 'Blocks.COPPER_BLOCK.weathering().unaffected())')
    line = line.replace('.publishServer(net.minecraft.world.level.GameType.', '.publishServer(net.minecraft.server.MinecraftServer.MultiplayerScope.LAN,net.minecraft.world.level.GameType.')
    line = line.replace('.publishServer(GameType.', '.publishServer(net.minecraft.server.MinecraftServer.MultiplayerScope.LAN,GameType.')
    line = line.replaceAll(/\b(b|cow)\.knockback\(([^(),]+),([^(),]+),([^(),]+)\)/) { all, entity, force, x, z -> "${entity}.knockback(${force},${x},${z},${entity}.damageSources().generic(),0f)" }
    if (rootProject.gameTarget == '26.3') {
        line = line.replace('org.lwjgl.util.tinyfd.TinyFileDialogs.tinyfd_selectFolderDialog','dev.mineagent.runtime.neoforge.client.nativeui.NativeFileDialogs.folder').replace('org.lwjgl.util.tinyfd.TinyFileDialogs.tinyfd_openFileDialog','dev.mineagent.runtime.neoforge.client.nativeui.NativeFileDialogs.open').replace('org.lwjgl.util.tinyfd.TinyFileDialogs.tinyfd_saveFileDialog','dev.mineagent.runtime.neoforge.client.nativeui.NativeFileDialogs.save')
        line = line.replace('ProjectInfo.URL,true)', 'java.net.URI.create(ProjectInfo.URL),true)')
        line = line.replace('p.drop(offered,false)', 'p.drop(offered,false,net.minecraft.util.Prediction.SERVER_ONLY)')

        if(line.contains('private final InterpolationHandler interpolation=')) return ' // Entity now owns the native interpolation handler.'
        line = line.replace('@Override public InterpolationHandler getInterpolation(){return interpolation;}', '@Override protected InterpolationHandler createInterpolationHandler(){return net.minecraft.world.entity.LinearInterpolationHandler.create(this,3);}')
        line = line.replace('interpolation.interpolate()', 'getInterpolation().interpolate()')
        line = line.replaceAll(/(?<![\w.])(?:net\.minecraft\.server\.packs\.)?AbstractPackResources\b/, 'dev.mineagent.runtime.neoforge.content.NativePackResources')
        line = line.replace('new Pack.ResourcesSupplier()', 'new dev.mineagent.runtime.neoforge.content.NativePackSupplier()')
        line = line.replaceAll(/(\b[a-zA-Z_][\w]*(?:\.[a-zA-Z_][\w]*)*)\.invulnerableTime\s*=\s*([^;]+);/) { all, entity, value -> entity+'.setInvulnerableTime('+value+');' }
        line = line.replaceAll(/(\b[a-zA-Z_][\w]*(?:\.[a-zA-Z_][\w]*)*)\.invulnerableTime\b/) { all, entity -> entity+'.getInvulnerableTime()' }
        line = line.replaceAll(/\.swing\((InteractionHand\.\w+|net\.minecraft\.world\.InteractionHand\.\w+|hand)\)/) { all, hand -> '.swing('+hand+',net.minecraft.world.item.component.SwingAnimation.DEFAULT,false)' }
        line = line.replace('.getAttackAnim(', '.getSwingAnimation(').replace('.setInvulnerable(', '.setPermanentlyInvulnerable(')
        line = line.replace('poses.mulPose(', 'poses.rotate(')
        line = line.replace('RenderTypes.entityTranslucentCullItemTarget(', 'RenderTypes.entityTranslucentCull(')
        line = line.replace(',null,outline,crumble)', ',null,outline)')
        line = line.replaceAll(/getBoundingBoxForCulling\((\w+) entity\)/) { all, type -> 'getBoundingBoxForCulling('+type+' entity,float partial)' }
        line = line.replace('screen.getGuiLeft()', '((dev.mineagent.runtime.neoforge.mixin.client.ContainerScreenGeometry)screen).divzero$left()').replace('screen.getGuiTop()', '((dev.mineagent.runtime.neoforge.mixin.client.ContainerScreenGeometry)screen).divzero$top()')
        line = line.replace('event.scancode()', 'event.keycode()')
        line = line.replace('MultiplayerScope.LAN,GameType.SURVIVAL,', 'MultiplayerScope.LAN,')
        line = line.replace('import net.minecraft.world.item.HoeItem;', '')
        line = line.replace('w.player().getInventory().getItem(i).getItem() instanceof HoeItem', 'w.player().getInventory().getItem(i).canPerformAction(net.neoforged.neoforge.common.ItemAbilities.HOE_TILL)')
        line = line.replace('w.player().getMainHandItem().getItem() instanceof HoeItem', 'w.player().getMainHandItem().canPerformAction(net.neoforged.neoforge.common.ItemAbilities.HOE_TILL)')

        line = line.replace('import org.lwjgl.glfw.GLFW;', '')
        def input = 'com.mojang.blaze3d.platform.InputConstants.'
        def aliases = ['ENTER':'RETURN','KP_ENTER':'NUMPADENTER','LEFT_SHIFT':'LSHIFT','RIGHT_SHIFT':'RSHIFT','LEFT_CONTROL':'LCONTROL','RIGHT_CONTROL':'RCONTROL','LEFT_ALT':'LALT','RIGHT_ALT':'RALT']
        line = line.replaceAll(/(?:org\.lwjgl\.glfw\.)?GLFW\.GLFW_KEY_([A-Z0-9_]+)/) { all, key -> key == 'UNKNOWN' ? input+'UNKNOWN.getValue()' : input+'KEY_'+aliases.getOrDefault(key,key) }
        line = line.replaceAll(/(?:org\.lwjgl\.glfw\.)?GLFW\.GLFW_(MOD_[A-Z_]+|PRESS|RELEASE|MOUSE_BUTTON_[A-Z_]+)/) { all, key -> input+(key == 'MOUSE_BUTTON_LAST' ? 'MOUSE_BUTTON_8' : key) }
        def functions = ['glfwGetKey':'key','glfwGetMouseButton':'mouse','glfwGetKeyScancode':'keycode','glfwFocusWindow':'focus','glfwIconifyWindow':'minimize','glfwRestoreWindow':'restore','glfwSetCursorPos':'cursor']
        line = line.replaceAll(/(?:org\.lwjgl\.glfw\.)?GLFW\.(glfw[A-Za-z]+)\(/) { all, function -> functions.containsKey(function) ? 'dev.mineagent.runtime.neoforge.client.nativeui.NativePlatformInput.'+functions[function]+'(' : all }
        line = line.replace('InputConstants.Type.KEYSYM','InputConstants.Type.KEYBOARD').replace('InputConstants.Type.SCANCODE','InputConstants.Type.KEYBOARD')
        line = line.replace('com.mojang.blaze3d.pipeline.RenderPipeline','com.mojang.renderpearl.api.pipeline.RenderPipeline')
        line = line.replace('new net.minecraft.client.input.MouseButtonInfo(0,','new net.minecraft.client.input.MouseButtonInfo('+input+'MOUSE_BUTTON_LEFT,')
        line = line.replaceAll(/\.button\(\)(\s*[!=]=\s*)([01])\b/) { all, op, button -> '.button()'+op+input+(button == '0' ? 'MOUSE_BUTTON_LEFT' : 'MOUSE_BUTTON_RIGHT') }
    }
    return line
}
def overlay = file('src/main/targets/26.2/java')
def specific = file("src/main/targets/${rootProject.gameTarget}/java")
def extra = rootProject.gameTarget == '26.2' ? [] : fileTree(specific).files.collect { specific.toPath().relativize(it.toPath()).toString().replace('\\','/') }
def replaced = (fileTree(overlay).files.collect { overlay.toPath().relativize(it.toPath()).toString().replace('\\','/') } + extra).toSet()
def prepared = tasks.register('prepareTargetSources', Sync) {
    inputs.property('gameTarget', rootProject.gameTarget)
    inputs.file(rootProject.file('gradle/modern-api.gradle'))
    from('src/main/java') { exclude(replaced); if(rootProject.gameTarget == '26.3') exclude('**/PotionBrewingAccess.java','**/PotionMixAccess.java'); filter { String line -> translate(line) } }
    from(overlay) { exclude(extra) }
    if (rootProject.gameTarget != '26.2') from(specific)
    into(layout.buildDirectory.dir('generated/target-java'))
    filteringCharset = 'UTF-8'
}
sourceSets.main.java.setSrcDirs([prepared])
tasks.named('jar') {
    archiveClassifier = "mc-${rootProject.gameTarget}-experimental"
    doFirst {
        if (!providers.gradleProperty('nativeProbe').getOrElse('false').toBoolean()) throw new GradleException('TARGET_DIAGNOSTICS_ONLY: use explicit nativeProbe for an isolated acceptance artifact, never a Release')
    }
}

if (rootProject.gameTarget == '26.3') {
    tasks.named('processResources') {
        filesMatching('mineagent_actions.mixins.json') { filter { String line -> line.contains('"PotionBrewingAccess"') || line.contains('"PotionMixAccess"') ? null : line } }
    }
}
