<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MineAgent · WebGUI</title><link rel="stylesheet" href="shell.css"><script type="module" src="shell.mjs"></script></head>
<body>
  <nav id="dock" aria-label="桌面工具栏" data-ui-aria="桌面工具栏">
    <strong>MineAgent</strong>
    <button id="open-chat" data-ui-text="对话">对话</button><button id="open-agents" data-ui-text="AI 管理">AI 管理</button><button id="open-generation" data-ui-text="创造">创造</button><button id="open-building-files" data-ui-text="文件">文件</button><button id="open-package-catalog" data-ui-text="包管理">包管理</button><button id="open-tasks" data-ui-text="任务">任务</button><button id="open-decisions" data-ui-text="待决定 (0)">待决定 (0)</button><button id="open-windows" data-ui-text="窗口">窗口</button>
    <details id="more-menu"><summary data-ui-text="更多">更多</summary><div id="more-panel" aria-label="更多工具" data-ui-aria="更多工具">
      <section><h2 data-ui-text="AI 与自动化">AI 与自动化</h2><button id="open-persona" data-ui-text="人设">人设</button><button id="open-appearance" data-ui-text="外观">外观</button><button id="open-preferences" data-ui-text="长期偏好">长期偏好</button><button id="open-events" data-ui-text="事件与订阅">事件与订阅</button><button id="open-schedules" data-ui-text="定时与条件">定时与条件</button></section>
      <section><h2 data-ui-text="内容与资源">内容与资源</h2><button id="open-package-assets" data-ui-text="跨世界资产">跨世界资产</button><button id="open-resource-packs" data-ui-text="本机资源包">本机资源包</button><button id="open-client-scripts" data-ui-text="本机 CLIENT 原生代码">本机 CLIENT 原生代码</button><button id="open-boot-extensions" data-ui-text="启动扩展">启动扩展</button></section>
      <section><h2 data-ui-text="记录与收件">记录与收件</h2><button id="open-task-history" data-ui-text="任务历史">任务历史</button><button id="open-generation-history" data-ui-text="生成历史">生成历史</button><button id="open-deliveries" data-ui-text="收件箱">收件箱</button><button id="open-feedback-history" data-ui-text="我的反馈">我的反馈</button><button id="open-sent-content" data-ui-text="已发内容">已发内容</button></section>
      <section><h2 data-ui-text="高级与设置">高级与设置</h2><button id="open-java-studio">Code Studio</button><button id="open-native-api">Native API</button><button id="open-api-settings" data-ui-text="API 设置">API 设置</button><button id="open-server-settings" data-ui-text="配置与权限">配置与权限</button><button id="open-renderer-settings" data-ui-text="界面设置">界面设置</button><button id="open-status" data-ui-text="宿主状态">宿主状态</button><button id="open-about" data-ui-text="关于">关于</button><button id="open-language" data-ui-text="语言">语言</button></section>
    </div></details>
    <button id="release" data-ui-text="返回游戏 · Esc">返回游戏 · Esc</button><button id="setup-notice" hidden data-ui-text="设置">设置</button><span id="status" role="status" data-ui-text="连接宿主…">连接宿主…</span>
  </nav>
  <main id="windows" aria-label="独立窗口" data-ui-aria="独立窗口"></main>
  <nav id="decision-page-tools" aria-label="选择问题分页" data-ui-aria="选择问题分页" hidden><button id="decision-prev" aria-label="上一页选择" data-ui-aria="上一页选择">‹</button><span id="decision-page-label"></span><button id="decision-next" aria-label="下一页选择" data-ui-aria="下一页选择">›</button><select id="decision-entry" aria-label="选择本页问题" data-ui-aria="选择本页问题"></select></nav>
  <footer id="minimized" aria-label="窗口任务栏" data-ui-aria="窗口任务栏"></footer>
</body></html>
